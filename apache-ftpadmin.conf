# Apache vhost for Ftbackend (Docker on VPS)
# Put this in /etc/apache2/sites-available/ftadmin.conf
#
# Docker exposes app on 127.0.0.1:3000 (web) and 127.0.0.1:4000 (api)
# HTTPS handled by certbot --apache after this file is enabled.

<VirtualHost *:80>
    ServerName YOUR_DOMAIN

    # Forward forwarded headers to app (Fastify needs X-Forwarded-*)
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Host %{HTTP_HOST}e

    # API (port 4000) — everything under /api
    ProxyPass /api/ http://127.0.0.1:4000/api/
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/

    # Uploaded media served by API static handler
    ProxyPass /uploads/ http://127.0.0.1:4000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:4000/uploads/

    # Web app (Next.js on port 3000) — catch-all MUST come last
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>