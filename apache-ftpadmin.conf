# Apache vhost for Ftbackend under https://fayyaz.travel/panel/
# Put this in /etc/apache2/sites-available/ftadmin.conf
#
# Docker exposes Fastify on 127.0.0.1:4000 (API + Vite SPA at /panel).
# The existing fayyaz.travel site stays on the root — only /panel/, /api/
# and /uploads/ are proxied here.

<VirtualHost *:80>
    ServerName fayyaz.travel

    # Forward forwarded headers to app (Fastify needs X-Forwarded-*)
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host %{HTTP_HOST}e

    # Keep the admin panel out of search indexes
    <LocationMatch "^/(panel|api|uploads)(/|$)">
        Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex"
    </LocationMatch>

    # Panel SPA (Vite build served by Fastify)
    ProxyPass /panel/ http://127.0.0.1:4000/panel/
    ProxyPassReverse /panel/ http://127.0.0.1:4000/panel/

    # API
    ProxyPass /api/ http://127.0.0.1:4000/api/
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/

    # Uploaded media
    ProxyPass /uploads/ http://127.0.0.1:4000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:4000/uploads/
</VirtualHost>
