# Apache vhost for Ftbackend under https://fayyaz.travel/panel/
# Put this in /etc/apache2/sites-available/ftadmin.conf
#
# Docker exposes app on 127.0.0.1:3000 (web) and 127.0.0.1:4000 (api).
# The app lives under the /panel/ basePath. The existing fayyaz.travel
# site (e.g. main website) stays on the root — only /panel/, /api/ and
# /uploads/ are proxied here.

<VirtualHost *:80>
    ServerName fayyaz.travel

    # Forward forwarded headers to app (Fastify needs X-Forwarded-*)
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host %{HTTP_HOST}e

    # Panel app (Next.js on port 3000, basePath /panel)
    ProxyPass /panel/ http://127.0.0.1:3000/panel/
    ProxyPassReverse /panel/ http://127.0.0.1:3000/panel/

    # Next.js static build assets
    ProxyPass /_next/ http://127.0.0.1:3000/_next/
    ProxyPassReverse /_next/ http://127.0.0.1:3000/_next/

    # API (Fastify on port 4000)
    ProxyPass /api/ http://127.0.0.1:4000/api/
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/

    # Uploaded media served by API static handler
    ProxyPass /uploads/ http://127.0.0.1:4000/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:4000/uploads/
</VirtualHost>