services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      SKIP_DB_INIT: "true"
      API_PORT: "4000"
      API_HOST: "0.0.0.0"
      # Reach MySQL on the VPS (same network namespace as host)
      DB_HOST: "127.0.0.1"
    network_mode: host
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
