services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      SKIP_DB_INIT: "true"      # use existing external MySQL; do not create schema
      API_PORT: "4000"
      API_HOST: "0.0.0.0"
    # Reach MySQL on the VPS host (DB_HOST=host.docker.internal in .env.production)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Fastify serves /panel, /api, /uploads — Apache proxies here
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
