services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      SKIP_DB_INIT: "true"
      API_PORT: "4000"
      API_HOST: "0.0.0.0"
      # Force host MySQL + correct DB (override stale .env.production values)
      DB_HOST: "127.0.0.1"
      DB_NAME: "fayyaz_new"
    # Same network namespace as the VPS so 127.0.0.1 reaches local MySQL
    network_mode: host
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
