services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      SKIP_DB_INIT: "true"      # use existing external MySQL; do not create schema
    ports:
      - "127.0.0.1:3000:3000"   # only reachable on VPS, behind Apache
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads:/app/uploads

volumes:
  uploads: