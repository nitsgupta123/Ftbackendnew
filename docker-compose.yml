services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fayyaz_new
      MYSQL_USER: fayyaz
      MYSQL_PASSWORD: fayyaz
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: fayyaz
      DB_PASSWORD: fayyaz
      DB_NAME: fayyaz_new
      API_PORT: "4000"
      API_HOST: "0.0.0.0"
      CORS_ORIGIN: "http://localhost:4000,http://127.0.0.1:4000"
      ADMIN_PANEL_URL: "http://localhost:4000/panel"
      ALLOW_PUBLIC_SIGNUP: "true"
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

volumes:
  db_data:
  uploads:
